[project]
name = "matrix-mikrotik-bot"
version = "0.0.1-dev"
description = "MikroTik management bot over the Matrix protocol"
requires-python = ">=3.14,<3.15"
dependencies = [
    "requests>=2.33.0",
    "urllib3>=2.7.0",
    "PyYAML>=6.0.1",
    "librouteros>=3.2.1",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "responses>=0.26.2",
    "ruff>=0.16.1",
    "types-PyYAML>=6.0.12.20260724",
    "types-requests>=2.33.0.20260712",
]

[tool.mypy]

[tool.basedpyright]
venvPath = "."
venv = ".venv"

[[tool.basedpyright.executionEnvironments]]
root = "bot/tests"
extraPaths = ["."]
reportUnusedCallResult = "none"

[tool.pytest.ini_options]
testpaths = ["bot/tests"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "CPY",
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"bot/_matrix_cli.py" = ["S603"]
"bot/tests/*" = ["S101", "PLR2004", "SIM117"]
